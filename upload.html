<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload — hxll.de</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #6e7681;
    --accent: #e3b341;
    --accent-dim: #a8842a;
    --error: #f85149;
    --success: #3fb950;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 480px;
  }

  .eyebrow {
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.04em;
    margin: 0 0 4px;
  }

  .eyebrow::before {
    content: "$ ";
    color: var(--accent-dim);
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 24px;
    color: var(--text);
  }

  h1 .caret {
    display: inline-block;
    width: 9px;
    height: 1.1em;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 1.1s step-end infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    h1 .caret { animation: none; }
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .field {
    margin-bottom: 12px;
  }

  .field-label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  input[type="password"] {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 12px 14px;
    border-radius: 6px;
    outline: none;
  }

  input[type="password"]::placeholder {
    color: var(--muted);
  }

  input[type="password"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(227, 179, 65, 0.15);
  }

  .dropzone {
    border: 1px dashed var(--border);
    background: var(--panel);
    border-radius: 8px;
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    margin-top: 8px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .dropzone:hover,
  .dropzone:focus-visible {
    border-color: var(--accent-dim);
  }

  .dropzone.drag-over {
    border-color: var(--accent);
    background: rgba(227, 179, 65, 0.06);
  }

  .dropzone:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .dropzone-text {
    color: var(--text);
    font-size: 14px;
    margin: 0 0 4px;
  }

  .dropzone-hint {
    color: var(--muted);
    font-size: 12px;
    margin: 0;
  }

  .file-info {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-top: 12px;
    font-size: 13px;
  }

  .file-meta {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .file-name {
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .file-size {
    color: var(--muted);
    font-size: 12px;
  }

  .clear-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    width: 26px;
    height: 26px;
    border-radius: 6px;
    cursor: pointer;
    flex-shrink: 0;
    font-size: 14px;
    line-height: 1;
  }

  .clear-btn:hover {
    background: var(--border);
    color: var(--text);
  }

  .primary-btn {
    width: 100%;
    background: var(--accent);
    color: #1a1305;
    border: none;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    padding: 12px 18px;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 16px;
    transition: background 0.15s ease;
  }

  .primary-btn:hover:not(:disabled) {
    background: #f0c25b;
  }

  .primary-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .primary-btn:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: default;
  }

  .progress {
    display: none;
    height: 3px;
    background: var(--border);
    border-radius: 3px;
    margin-top: 12px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    width: 40%;
    background: var(--accent);
    border-radius: 3px;
    animation: slide 1.1s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .progress-bar { animation: none; opacity: 0.6; width: 100%; }
  }

  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
  }

  .result, .error {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 14px;
    display: none;
  }

  .result {
    background: var(--panel);
    border: 1px solid var(--success);
  }

  .result-status {
    color: var(--success);
    font-size: 13px;
    margin: 0 0 8px;
  }

  .result-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .result a {
    color: var(--accent);
    text-decoration: none;
    word-break: break-all;
  }

  .result a:hover {
    text-decoration: underline;
  }

  .copy-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 10px;
    font-size: 12px;
    border-radius: 6px;
    cursor: pointer;
    flex-shrink: 0;
    font-family: inherit;
  }

  .copy-btn:hover:not(:disabled) {
    background: var(--border);
    color: var(--text);
  }

  .copy-btn.copied {
    border-color: var(--accent-dim);
    color: var(--accent);
  }

  .error {
    background: rgba(248, 81, 73, 0.08);
    border: 1px solid var(--error);
    color: var(--error);
  }

  .hint {
    color: var(--muted);
    font-size: 12px;
    margin-top: 14px;
    line-height: 1.5;
  }
</style>
</head>
<body>

  <div class="card">
    <p class="eyebrow">hxll.de</p>
    <h1>upload a file<span class="caret"></span></h1>

    <div class="field">
      <label class="field-label" for="password">password</label>
      <input type="password" id="password" placeholder="upload password" autocomplete="off">
    </div>

    <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Select a file to upload">
      <p class="dropzone-text" id="dropzone-text">drop a file here</p>
      <p class="dropzone-hint">or click to browse — any file type</p>
    </div>
    <input type="file" id="file-input" hidden>

    <div class="file-info" id="file-info">
      <div class="file-meta">
        <span class="file-name" id="file-name"></span>
        <span class="file-size" id="file-size"></span>
      </div>
      <button class="clear-btn" id="clear-btn" type="button" aria-label="Remove selected file">×</button>
    </div>

    <button class="primary-btn" id="upload-btn" disabled>Upload</button>

    <div class="progress" id="progress"><div class="progress-bar"></div></div>

    <div class="result" id="result">
      <p class="result-status">✓ uploaded</p>
      <div class="result-row">
        <a id="result-link" href="#" target="_blank" rel="noopener"></a>
        <button class="copy-btn" id="copy-btn" type="button">Copy</button>
      </div>
    </div>

    <div class="error" id="error"></div>

    <p class="hint">Served from cdn.hxll.de. A password is required for every upload.</p>
  </div>

  <script>
    const UPLOAD_URL = 'https://cdn-upload-worker.inqueries-hxll.workers.dev/';
    const CDN_ORIGIN = 'https://cdn.hxll.de';

    const dropzone = document.getElementById('dropzone');
    const dropzoneText = document.getElementById('dropzone-text');
    const fileInput = document.getElementById('file-input');
    const passwordInput = document.getElementById('password');
    const uploadBtn = document.getElementById('upload-btn');
    const fileInfo = document.getElementById('file-info');
    const fileNameEl = document.getElementById('file-name');
    const fileSizeEl = document.getElementById('file-size');
    const clearBtn = document.getElementById('clear-btn');
    const progress = document.getElementById('progress');
    const resultBox = document.getElementById('result');
    const resultLink = document.getElementById('result-link');
    const copyBtn = document.getElementById('copy-btn');
    const errorBox = document.getElementById('error');

    let selectedFile = null;

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        fileInput.click();
      }
    });

    fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('drag-over');
    });
    dropzone.addEventListener('dragleave', () => {
      dropzone.classList.remove('drag-over');
    });
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('drag-over');
      handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file) {
      if (!file) return;
      selectedFile = file;
      fileNameEl.textContent = file.name;
      fileSizeEl.textContent = formatFileSize(file.size);
      fileInfo.style.display = 'flex';
      dropzoneText.textContent = 'drop to replace';
      uploadBtn.disabled = false;
      resultBox.style.display = 'none';
      errorBox.style.display = 'none';
    }

    function resetSelection() {
      selectedFile = null;
      fileInput.value = '';
      fileInfo.style.display = 'none';
      dropzoneText.textContent = 'drop a file here';
      uploadBtn.disabled = true;
    }

    clearBtn.addEventListener('click', resetSelection);

    function formatFileSize(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return `${Math.round((bytes / Math.pow(k, i)) * 100) / 100} ${sizes[i]}`;
    }

    function validateCdnUrl(url) {
      try {
        const parsed = new URL(url);
        if (parsed.origin !== CDN_ORIGIN) return null;
        return parsed.href;
      } catch {
        return null;
      }
    }

    function showError(message) {
      resultBox.style.display = 'none';
      errorBox.textContent = message;
      errorBox.style.display = 'block';
    }

    function showResult(url) {
      errorBox.style.display = 'none';
      resultLink.href = url;
      resultLink.textContent = url;
      resultBox.style.display = 'block';
      copyBtn.textContent = 'Copy';
      copyBtn.classList.remove('copied');
    }

    uploadBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      const password = passwordInput.value.trim();
      if (!password) {
        showError('Enter the upload password first.');
        return;
      }

      const formData = new FormData();
      formData.append('file', selectedFile);

      uploadBtn.disabled = true;
      progress.style.display = 'block';
      resultBox.style.display = 'none';
      errorBox.style.display = 'none';

      try {
        const response = await fetch(UPLOAD_URL, {
          method: 'POST',
          headers: { 'X-Upload-Password': password },
          body: formData,
        });

        const result = await response.json();

        if (response.ok && result.success) {
          const safeUrl = validateCdnUrl(result.url);
          if (!safeUrl) {
            showError('Upload failed: unexpected response from server.');
            uploadBtn.disabled = false;
            return;
          }
          showResult(safeUrl);
          resetSelection();
        } else {
          const message = typeof result.error === 'string' && result.error.trim() !== ''
            ? result.error
            : 'Unknown error.';
          showError(`Upload failed: ${message}`);
          uploadBtn.disabled = false;
        }
      } catch (err) {
        const message = err instanceof TypeError
          ? 'Could not reach the upload server. Check your connection or try again.'
          : (err.message || 'Something went wrong uploading that file.');
        showError(message);
        uploadBtn.disabled = false;
      } finally {
        progress.style.display = 'none';
      }
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(resultLink.href);
        copyBtn.textContent = 'Copied';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'Copy';
          copyBtn.classList.remove('copied');
        }, 1500);
      } catch {
        const range = document.createRange();
        range.selectNode(resultLink);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
      }
    });
  </script>

</body>
</html>
