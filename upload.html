<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDN Upload - hxll.de</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .auth-section {
            margin-bottom: 30px;
        }

        .upload-section {
            display: none;
        }

        .upload-section.active {
            display: block;
        }

        .password-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        .password-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9ff;
        }

        .upload-area:hover {
            background: #f0f2ff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #e8ebff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #666;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .upload-subtext {
            color: #999;
            font-size: 13px;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
        }

        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .url-display {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .url-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #c3e6cb;
            border-radius: 5px;
            font-family: monospace;
            font-size: 13px;
        }

        .btn-copy {
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-copy:hover {
            background: #218838;
        }

        .quota-info {
            margin-top: 10px;
            padding: 10px;
            background: #e7f3ff;
            border-radius: 5px;
            font-size: 13px;
            color: #004085;
        }

        .file-info {
            margin-top: 15px;
            padding: 10px;
            background: #f8f9ff;
            border-radius: 5px;
            font-size: 13px;
            color: #333;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 CDN Upload</h1>
        <p class="subtitle">Secure file upload to hxll.de CDN</p>

        <div class="auth-section" id="authSection">
            <input type="password" class="password-input" id="passwordInput" placeholder="Enter upload password">
            <button class="btn btn-primary" onclick="authenticate()">Authenticate</button>
            <div id="authResult"></div>
        </div>

        <div class="upload-section" id="uploadSection">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <div class="upload-text">Click to select or drag & drop</div>
                <div class="upload-subtext">Images and videos only</div>
            </div>
            <input type="file" id="fileInput" accept="image/*,video/*">
            <div class="file-info" id="fileInfo" style="display: none;"></div>
            <button class="btn btn-primary" id="uploadBtn" style="display: none;" onclick="uploadFile()">Upload File</button>
            <div id="result"></div>
        </div>
    </div>

    <script>
        let selectedFile = null;
        let uploadPassword = null;

        async function authenticate() {
            const password = document.getElementById('passwordInput').value;
            const resultDiv = document.getElementById('authResult');

            if (!password) {
                resultDiv.innerHTML = '<div class="result error">Please enter a password</div>';
                return;
            }

            uploadPassword = password;
            
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('uploadSection').classList.add('active');
        }

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInfo = document.getElementById('fileInfo');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelect(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        function handleFileSelect(file) {
            selectedFile = file;
            const sizeMB = (file.size / 1024 / 1024).toFixed(2);
            fileInfo.style.display = 'block';
            fileInfo.innerHTML = `<strong>Selected:</strong> ${file.name} (${sizeMB} MB)`;
            uploadBtn.style.display = 'block';
        }

        async function uploadFile() {
            if (!selectedFile) {
                showResult('Please select a file', 'error');
                return;
            }

            if (!uploadPassword) {
                showResult('Authentication required', 'error');
                return;
            }

            const resultDiv = document.getElementById('result');
            uploadBtn.disabled = true;
            resultDiv.innerHTML = '<div class="result"><div class="spinner"></div>Uploading...</div>';

            try {
                const formData = new FormData();
                formData.append('file', selectedFile);

                const response = await fetch('https://cdn-upload-worker.inqueries-hxll.workers.dev/', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Upload-Password': uploadPassword
                    }
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    let resultHTML = `
                        <div class="result success">
                            <strong>✅ Upload successful!</strong>
                            <div class="url-display">
                                <input type="text" class="url-input" id="cdnUrl" value="${data.url}" readonly>
                                <button class="btn-copy" onclick="copyUrl()">Copy</button>
                            </div>
                    `;
                    
                    if (data.quota) {
                        resultHTML += `
                            <div class="quota-info">
                                <strong>Monthly Quota:</strong> ${data.quota.used} used / ${data.quota.remaining} remaining
                            </div>
                        `;
                    }
                    
                    resultHTML += '</div>';
                    resultDiv.innerHTML = resultHTML;
                    
                    // Reset file selection
                    selectedFile = null;
                    fileInput.value = '';
                    fileInfo.style.display = 'none';
                    uploadBtn.style.display = 'none';
                } else {
                    showResult(data.error || 'Upload failed', 'error');
                }
            } catch (error) {
                showResult('Network error: ' + error.message, 'error');
            } finally {
                uploadBtn.disabled = false;
            }
        }

        function showResult(message, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `<div class="result ${type}">${message}</div>`;
        }

        function copyUrl() {
            const urlInput = document.getElementById('cdnUrl');
            urlInput.select();
            document.execCommand('copy');
            
            const copyBtn = event.target;
            const originalText = copyBtn.textContent;
            copyBtn.textContent = 'Copied!';
            setTimeout(() => {
                copyBtn.textContent = originalText;
            }, 2000);
        }
    </script>
</body>
</html>
