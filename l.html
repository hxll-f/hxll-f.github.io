<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hxll.de/l</title>
<script>
  // Runs synchronously before paint, so the form never flashes on redirect links.
  if (window.location.search.length > 1) {
    document.documentElement.classList.add('has-code');
  }
</script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #6e7681;
    --accent: #e3b341;
    --accent-dim: #a8842a;
    --error: #f85149;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 480px;
  }

  .eyebrow {
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.04em;
    margin: 0 0 4px;
  }

  .eyebrow::before {
    content: "$ ";
    color: var(--accent-dim);
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 24px;
    color: var(--text);
  }

  h1 .caret {
    display: inline-block;
    width: 9px;
    height: 1.1em;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 1.1s step-end infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    h1 .caret { animation: none; }
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  form {
    display: flex;
    gap: 8px;
  }

  input[type="url"] {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 12px 14px;
    border-radius: 6px;
    outline: none;
    min-width: 0;
  }

  input[type="url"]::placeholder {
    color: var(--muted);
  }

  input[type="url"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(227, 179, 65, 0.15);
  }

  button {
    background: var(--accent);
    color: #1a1305;
    border: none;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    padding: 12px 18px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease;
  }

  button:hover:not(:disabled) {
    background: #f0c25b;
  }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  button:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: default;
  }

  .result, .error {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 14px;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .result {
    background: var(--panel);
    border: 1px solid var(--accent-dim);
  }

  .result a {
    color: var(--accent);
    text-decoration: none;
    word-break: break-all;
  }

  .result a:hover {
    text-decoration: underline;
  }

  .copy-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 10px;
    font-size: 12px;
    flex-shrink: 0;
  }

  .copy-btn:hover:not(:disabled) {
    background: var(--border);
    color: var(--text);
  }

  .copy-btn.copied {
    border-color: var(--accent-dim);
    color: var(--accent);
  }

  .error {
    background: rgba(248, 81, 73, 0.08);
    border: 1px solid var(--error);
    color: var(--error);
  }

  .hint {
    color: var(--muted);
    font-size: 12px;
    margin-top: 14px;
    line-height: 1.5;
  }

  #redirect-view {
    display: none;
    color: var(--muted);
    font-size: 14px;
  }

  html.has-code #shorten-view { display: none; }
  html.has-code #redirect-view { display: block; }

  /* --- destination preview card --- */

  .preview-card {
    display: none;
    flex-direction: column;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-top: 4px;
  }

  .preview-card.visible {
    display: flex;
  }

  .preview-head {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .preview-favicon {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    flex-shrink: 0;
    background: var(--bg);
  }

  .preview-host {
    color: var(--muted);
    font-size: 12px;
    word-break: break-all;
  }

  .preview-image {
    display: none;
    width: 100%;
    max-height: 200px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border);
  }

  .preview-title {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }

  .preview-desc {
    display: none;
    margin: 0;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.45;
  }

  .preview-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 4px;
  }

  .countdown-text {
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
  }

  .btn-row {
    display: flex;
    gap: 8px;
  }

  .btn-continue, .btn-cancel {
    font-family: inherit;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
  }

  .btn-continue {
    background: var(--accent);
    color: #1a1305;
    border: none;
    font-weight: 600;
    transition: background 0.15s ease;
  }

  .btn-continue:hover {
    background: #f0c25b;
  }

  .btn-cancel {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .btn-cancel:hover {
    background: var(--border);
    color: var(--text);
  }
</style>
</head>
<body>

  <div class="card">
    <p class="eyebrow">hxll.de</p>

    <div id="shorten-view">
      <h1>shorten a link<span class="caret"></span></h1>

      <form id="shorten-form">
        <input
          type="url"
          id="url-input"
          placeholder="https://example.com/very/long/path"
          required
          autocomplete="off"
          spellcheck="false"
        >
        <button type="submit" id="submit-btn">Shorten</button>
      </form>

      <div class="result" id="result">
        <a id="result-link" href="#" target="_blank" rel="noopener"></a>
        <button class="copy-btn" id="copy-btn" type="button">Copy</button>
      </div>

      <div class="error" id="error"></div>

      <p class="hint">Paste a URL, hit shorten (or press Enter). Same URL always gives the same short link.</p>
    </div>

    <div id="redirect-view">
      <p id="redirect-status">redirecting…</p>

      <div class="preview-card" id="preview-card">
        <div class="preview-head">
          <img class="preview-favicon" id="preview-favicon" alt="">
          <span class="preview-host" id="preview-host"></span>
        </div>
        <img class="preview-image" id="preview-image" alt="">
        <p class="preview-title" id="preview-title"></p>
        <p class="preview-desc" id="preview-desc"></p>
        <div class="preview-actions">
          <span class="countdown-text" id="countdown-text"></span>
          <div class="btn-row">
            <button class="btn-cancel" id="btn-cancel" type="button">stay</button>
            <button class="btn-continue" id="btn-continue" type="button">continue →</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://link-shortener.inqueries-hxll.workers.dev/';
    const REDIRECT_DELAY_SECONDS = 4;

    const form = document.getElementById('shorten-form');
    const input = document.getElementById('url-input');
    const submitBtn = document.getElementById('submit-btn');
    const resultBox = document.getElementById('result');
    const resultLink = document.getElementById('result-link');
    const copyBtn = document.getElementById('copy-btn');
    const errorBox = document.getElementById('error');

    function showResult(shortUrl) {
      errorBox.style.display = 'none';
      resultLink.href = shortUrl;
      resultLink.textContent = shortUrl;
      resultBox.style.display = 'flex';
      copyBtn.textContent = 'Copy';
      copyBtn.classList.remove('copied');
    }

    function showError(message) {
      resultBox.style.display = 'none';
      errorBox.textContent = message;
      errorBox.style.display = 'flex';
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      submitBtn.textContent = isLoading ? 'Shortening…' : 'Shorten';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const url = input.value.trim();
      if (!url) return;

      setLoading(true);
      errorBox.style.display = 'none';
      resultBox.style.display = 'none';

      const formData = new FormData();
      // ASSUMPTION: adjust the field name below to match what your Worker expects.
      formData.append('url', url);

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          let detail = '';
          try {
            detail = await response.text();
          } catch (_) {}
          throw new Error(
            `Server returned ${response.status}${detail ? ': ' + detail : ''}`
          );
        }

        const data = await response.json();
        if (!data.shortUrl) {
          throw new Error('Response did not include a short URL.');
        }

        showResult(data.shortUrl);

      } catch (err) {
        // Fallback: network failure, CORS issue, bad JSON, non-2xx, etc.
        // all land here with a readable message instead of a silent failure.
        const message = err instanceof TypeError
          ? 'Could not reach the shortener. Check your connection or try again.'
          : err.message || 'Something went wrong shortening that link.';
        showError(message);
      } finally {
        setLoading(false);
      }
    });

    // If this page was opened as hxll.de/l?[code], resolve it. If the worker
    // returns preview metadata for the destination, show a card and count
    // down instead of redirecting instantly. If it doesn't (older worker,
    // or metadata fetch failed server-side), fall straight back to the old
    // instant-redirect behavior — this keeps working either way.
    (async function resolveIfCode() {
      const code = window.location.search.slice(1); // everything after '?'
      if (!code) return;

      const statusEl = document.getElementById('redirect-status');

      try {
        const resp = await fetch(`${WORKER_URL}?code=${encodeURIComponent(code)}`);

        if (resp.status === 404) {
          statusEl.textContent = "this link doesn't exist (or was mistyped).";
          return;
        }
        if (!resp.ok) {
          throw new Error(`Server returned ${resp.status}`);
        }

        const data = await resp.json();
        if (!data.url) {
          throw new Error('No destination URL in response.');
        }

        if (!data.meta) {
          document.title = 'Redirecting…';
          window.location.replace(data.url);
          return;
        }

        showPreviewAndRedirect(data.url, data.meta);

      } catch (err) {
        // Fallback: network failure or bad response — tell the user rather
        // than leaving them stuck on a blank "redirecting…" message.
        statusEl.textContent = 'could not resolve this link. try again in a moment.';
      }
    })();

    function showPreviewAndRedirect(url, meta) {
      const statusEl = document.getElementById('redirect-status');
      const card = document.getElementById('preview-card');
      const favicon = document.getElementById('preview-favicon');
      const host = document.getElementById('preview-host');
      const image = document.getElementById('preview-image');
      const title = document.getElementById('preview-title');
      const desc = document.getElementById('preview-desc');
      const countdownText = document.getElementById('countdown-text');
      const btnContinue = document.getElementById('btn-continue');
      const btnCancel = document.getElementById('btn-cancel');

      let destHost;
      try {
        destHost = new URL(url).hostname;
      } catch (_) {
        destHost = url;
      }

      if (meta.favicon) {
        favicon.src = meta.favicon;
        favicon.onerror = () => { favicon.style.visibility = 'hidden'; };
      } else {
        favicon.style.visibility = 'hidden';
      }

      host.textContent = destHost;
      title.textContent = meta.title || destHost;

      if (meta.description) {
        desc.textContent = meta.description;
        desc.style.display = 'block';
      }

      if (meta.image) {
        image.src = meta.image;
        image.style.display = 'block';
        image.onerror = () => { image.style.display = 'none'; };
      }

      statusEl.style.display = 'none';
      card.classList.add('visible');

      let secondsLeft = REDIRECT_DELAY_SECONDS;
      countdownText.textContent = `redirecting in ${secondsLeft}s…`;

      const timer = setInterval(() => {
        secondsLeft -= 1;
        if (secondsLeft <= 0) {
          clearInterval(timer);
          go();
          return;
        }
        countdownText.textContent = `redirecting in ${secondsLeft}s…`;
      }, 1000);

      function go() {
        clearInterval(timer);
        document.title = 'Redirecting…';
        window.location.href = url;
      }

      function stay() {
        clearInterval(timer);
        countdownText.textContent = 'redirect cancelled.';
        btnContinue.textContent = 'go now →';
      }

      btnContinue.addEventListener('click', go);
      btnCancel.addEventListener('click', stay);
    }

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(resultLink.href);
        copyBtn.textContent = 'Copied';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'Copy';
          copyBtn.classList.remove('copied');
        }, 1500);
      } catch (_) {
        // Clipboard API unavailable (e.g. non-HTTPS context) — select text as fallback.
        const range = document.createRange();
        range.selectNode(resultLink);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
      }
    });
  </script>

</body>
</html>
